services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: warmibd
      POSTGRES_USER: warmi
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql   # correcto para versiones de 18+
    # - ./postgres_data:/var/lib/postgresql/data # válido para versiones anteriores

  # Opcional: pgAdmin para la gestión de bases de datos
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@warmi.com
      PGADMIN_DEFAULT_PASSWORD: admin_warmi
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  pgadmin_data:
